---
name: 💡 Feature request
description: Suggest an improvement to ClipVee
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ClipVee is clipboard history only, in the spirit of Windows' Win+V, so it won't add emoji, GIF or AI tabs.
  - type: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues for a similar request.
          required: false
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Idea
      description: What you'd like ClipVee to do. A sketch or screenshot helps.
    validations:
      required: false
