---
name: 🐛 Bug report
description: Something in ClipVee isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please use made-up examples and leave real clipboard contents out of text and screenshots.
  - type: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues for this problem.
          required: false
        - label: I read the [troubleshooting answers](https://github.com/mzbali/ClipVee#troubleshooting).
          required: false
  - type: input
    attributes:
      label: ClipVee version
      description: Shown in Settings → About.
      placeholder: e.g. 1.0.5
    validations:
      required: true
  - type: input
    attributes:
      label: macOS version
      placeholder: e.g. 26.1
    validations:
      required: true
  - type: dropdown
    attributes:
      label: How did you install it?
      options:
        - Disk image from GitHub
        - Homebrew
        - Built from source
  - type: textarea
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: If you can, attach a short screen recording (⌘⇧5).
      placeholder: |
        1. Open the panel with ⌘⇧V
        2. …
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant settings
      description: For example the panel position, Paste automatically, or ignored apps, if they might matter.
    validations:
      required: false
