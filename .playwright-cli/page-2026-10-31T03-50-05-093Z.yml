        - heading "It can't send your clipboard anywhere." [level=2] [ref=e143]
        - paragraph [ref=e144]: ClipVee runs in Apple's app sandbox and doesn't ask for network access, so it has no way to reach the internet. No account, no analytics, no cloud.
        - list [ref=e145]:
          - listitem [ref=e146]: Passwords copied from password managers are skipped
          - listitem [ref=e147]: Ignore whole apps, pause history, or skip just the next copy
          - listitem [ref=e148]: Everything is open source, so anyone can check
      - generic "Terminal output listing ClipVee's permissions" [ref=e149]: $ codesign -d --entitlements - ClipVee.app ✓ app-sandbox ✓ files.user-selected.read-only ✗ network.client not requested ✗ network.server not requested
